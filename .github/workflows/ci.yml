name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Format
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src
      - name: Security scan
        run: bandit -q -r src scripts -ll
      - name: Test
        run: pytest
