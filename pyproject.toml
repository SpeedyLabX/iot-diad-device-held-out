[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-diad-evaluation"
version = "0.1.0"
description = "Reproducible device-held-out evaluation for the CIC IoT-DIAD 2024 dataset"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "joblib>=1.5,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "polars>=1.34,<2",
  "scikit-learn>=1.9,<1.10",
  "scipy>=1.15,<2",
  "threadpoolctl>=3.5,<4",
]

[project.urls]
Homepage = "https://github.com/SpeedyLabX/iot-diad-device-held-out"
Documentation = "https://github.com/SpeedyLabX/iot-diad-device-held-out/tree/main/docs"
Issues = "https://github.com/SpeedyLabX/iot-diad-device-held-out/issues"

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "jupyterlab>=4.3,<5",
  "mypy>=1.15,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
iot-diad-audit = "iot_diad.audit:main"
iot-diad-eda = "iot_diad.eda:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["iot_diad"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "joblib", "threadpoolctl"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
